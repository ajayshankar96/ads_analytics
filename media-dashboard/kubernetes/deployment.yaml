apiVersion: apps/v1
kind: Deployment
metadata:
  name: media-dashboard
  namespace: analytics-tools
  labels:
    app: media-dashboard
    devstack_label: analytics
    bu: ads
    label: analytics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: media-dashboard
  template:
    metadata:
      labels:
        app: media-dashboard
        devstack_label: analytics
    spec:
      containers:
      - name: app
        image: python:3.11-slim
        command:
          - /bin/bash
          - -c
          - |
            apt-get update -qq && apt-get install -y -qq git &&
            git clone --depth 1 https://github.com/ajayshankar96/ads_analytics.git /app &&
            cd /app/media-dashboard/backend &&
            pip install --no-cache-dir -q -r requirements.txt &&
            uvicorn main:app --host 0.0.0.0 --port 8000
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: MASTER_SPREADSHEET_ID
          valueFrom:
            configMapKeyRef:
              name: media-dashboard-config
              key: MASTER_SPREADSHEET_ID
        - name: KPI_SPREADSHEET_ID
          valueFrom:
            configMapKeyRef:
              name: media-dashboard-config
              key: KPI_SPREADSHEET_ID
        - name: CACHE_REFRESH_INTERVAL
          valueFrom:
            configMapKeyRef:
              name: media-dashboard-config
              key: CACHE_REFRESH_INTERVAL
        - name: OAUTH_TOKEN_JSON_CONTENT
          valueFrom:
            secretKeyRef:
              name: media-dashboard-secrets
              key: OAUTH_TOKEN_JSON_CONTENT
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: media-dashboard-secrets
              key: ANTHROPIC_API_KEY
              optional: true
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 120
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 90
          periodSeconds: 10
