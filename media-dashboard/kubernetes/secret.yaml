apiVersion: v1
kind: Secret
metadata:
  name: media-dashboard-secrets
  namespace: analytics-tools
type: Opaque
# IMPORTANT: Do NOT commit real values here.
# Apply this secret manually or via CI/CD:
#
#   kubectl create secret generic media-dashboard-secrets \
#     --namespace=analytics-tools \
#     --from-literal=OAUTH_TOKEN_JSON_CONTENT="$(cat oauth_token.json)" \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# The OAUTH_TOKEN_JSON_CONTENT must be the full JSON from oauth_token.json
# (generated by running the backend locally and completing the browser login once)
stringData:
  OAUTH_TOKEN_JSON_CONTENT: "REPLACE_WITH_OAUTH_TOKEN_JSON"
