apiVersion: apps/v1
kind: Deployment
metadata:
  name: media-dashboard
  namespace: analytics-tools
  labels:
    app: media-dashboard
    devstack_label: analytics
    bu: ads
    label: analytics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: media-dashboard
  template:
    metadata:
      labels:
        app: media-dashboard
        devstack_label: analytics
    spec:
      containers:
      - name: app
        image: c.rzp.io/razorpay/media-dashboard:latest
        ports:
        - containerPort: 8000
          name: http
        envFrom:
        - secretRef:
            name: media-dashboard-postgres-credentials
        env:
        - name: MASTER_SPREADSHEET_ID
          valueFrom:
            configMapKeyRef:
              name: media-dashboard-config
              key: MASTER_SPREADSHEET_ID
        - name: KPI_SPREADSHEET_ID
          valueFrom:
            configMapKeyRef:
              name: media-dashboard-config
              key: KPI_SPREADSHEET_ID
        - name: CACHE_REFRESH_INTERVAL
          valueFrom:
            configMapKeyRef:
              name: media-dashboard-config
              key: CACHE_REFRESH_INTERVAL
        # ── Auth gate ──
        - name: GOOGLE_CLIENT_ID
          valueFrom:
            configMapKeyRef:
              name: media-dashboard-config
              key: GOOGLE_CLIENT_ID
              optional: true
        - name: GOOGLE_REDIRECT_URI
          valueFrom:
            configMapKeyRef:
              name: media-dashboard-config
              key: GOOGLE_REDIRECT_URI
              optional: true
        - name: ALLOWED_EMAILS
          valueFrom:
            configMapKeyRef:
              name: media-dashboard-config
              key: ALLOWED_EMAILS
              optional: true
        - name: GOOGLE_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: media-dashboard-secrets
              key: GOOGLE_CLIENT_SECRET
              optional: true
        - name: SESSION_SECRET
          valueFrom:
            secretKeyRef:
              name: media-dashboard-secrets
              key: SESSION_SECRET
              optional: true
        - name: OAUTH_TOKEN_JSON_CONTENT
          valueFrom:
            secretKeyRef:
              name: media-dashboard-secrets
              key: OAUTH_TOKEN_JSON_CONTENT
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: media-dashboard-secrets
              key: ANTHROPIC_API_KEY
              optional: true
        - name: LITELLM_API_KEY
          valueFrom:
            secretKeyRef:
              name: media-dashboard-secrets
              key: LITELLM_API_KEY
              optional: true
        - name: ANTHROPIC_BASE_URL
          valueFrom:
            configMapKeyRef:
              name: media-dashboard-config
              key: ANTHROPIC_BASE_URL
              optional: true
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 10
