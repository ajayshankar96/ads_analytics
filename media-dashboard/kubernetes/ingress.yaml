apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: media-dashboard-ingress
  namespace: analytics-tools
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
  - hosts:
    - 3p-media-dashboard.dev.razorpay.com
    secretName: media-dashboard-tls
  rules:
  - host: 3p-media-dashboard.dev.razorpay.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: media-dashboard-frontend
            port:
              number: 80
