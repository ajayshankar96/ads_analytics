apiVersion: traefik.containo.us/v1alpha1
kind: IngressRoute
metadata:
  name: media-dashboard
  namespace: analytics-tools
  annotations:
    janitor/ttl: forever
    kubernetes.io/ingress.class: traefik-concierge
  labels:
    app: media-dashboard
    devstack_label: analytics
spec:
  entryPoints:
  - web
  routes:
  - kind: Rule
    match: Host(`3p-media-dashboard.dev.razorpay.in`) && Headers(`rzpctx-dev-serve-user`,`analytics`)
    services:
    - name: media-dashboard
      port: 8000
  - kind: Rule
    match: Host(`3p-media-dashboard-analytics.dev.razorpay.in`)
    middlewares:
    - name: injectheader-analytics
    services:
    - name: media-dashboard
      port: 8000
